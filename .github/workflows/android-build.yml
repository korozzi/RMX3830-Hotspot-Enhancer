name: Android build

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: RMX3830-Hotspot-Enhancer-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
