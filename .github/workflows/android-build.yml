name: Android build

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign APK for testing
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          KEYSTORE="$RUNNER_TEMP/test-signing.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass test-only-password -keypass test-only-password -alias test-key -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=RMX3830 Hotspot Enhancer Test Build, OU=Testing, O=Open Source, L=Unknown, ST=Unknown, C=US'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias test-key --ks-pass pass:test-only-password --key-pass pass:test-only-password --out app/build/outputs/apk/release/RMX3830-Hotspot-Enhancer-test-signed.apk "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/RMX3830-Hotspot-Enhancer-test-signed.apk
          rm -f "$KEYSTORE"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: RMX3830-Hotspot-Enhancer-test-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/RMX3830-Hotspot-Enhancer-test-signed.apk
          if-no-files-found: error
          retention-days: 14
