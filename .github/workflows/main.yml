name: Build RMX3830 Hotspot Enhancer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Clean generated Settings hook source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/rmx3830/hotspot/HotspotModule.java")
          s = p.read_text()
          marker = "    private void installSettingsUiHook(ClassLoader settingsLoader) {"
          second = "    private void installSettingsUiHook(ClassLoader loader) {"
          a = s.find(marker)
          b = s.find(second, a + 1)
          if a >= 0 and b > a:
              s = s[:a] + s[b:]
          s = s.replace("        installSettingsUiHook(param.getClassLoader());\n        installSettingsUiHook(param.getClassLoader());",
                        "        installSettingsUiHook(param.getClassLoader());")
          s = s.replace("                    installPermissionBypass(loader);\n", "")
          p.write_text(s)
          PY
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Build Magisk ZIP
        run: python3 scripts/package_magisk.py
      - name: Validate
        run: |
          unzip -l dist/RMX3830-Hotspot-Enhancer-v1.0.0-Magisk.zip
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'META-INF/xposed/'
      - uses: actions/upload-artifact@v4
        with:
          name: RMX3830-Hotspot-Enhancer-APK-v1.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RMX3830-Hotspot-Enhancer-Magisk-v1.0.0
          path: dist/RMX3830-Hotspot-Enhancer-v1.0.0-Magisk.zip
          if-no-files-found: error
